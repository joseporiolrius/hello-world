# hello-world Deployment (APP-13): two replicas of the student's OWN released
# image, with liveness/readiness probes on the fixed /health:8000 contract.
# The image line below is a placeholder: put your GitHub user name (lower case)
# and your release tag in it. The namespace-scoped `ghcr-pull` imagePullSecret
# is created after the namespace.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  namespace: hello
  labels:
    app: hello-world
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world
  template:
    metadata:
      labels:
        app: hello-world
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: app
          image: ghcr.io/<your-github-username>/hello-world:<your-older-release-tag>   # student: YOUR account and tag
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
