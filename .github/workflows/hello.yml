# S1 hello workflow (APP-01). Runs on every push: it visibly checks out the
# repository, sets up uv, and runs the bootstrap. Students do NOT edit this in
# S1 — they only need to see it go green in the Actions tab and upload the
# screenshot as evidence. The student-authored quality workflow (ci.yml) is
# written later in S3 and is deliberately absent here.
# Action versions run on Node.js 24 (no Node 20 deprecation warning).
name: hello
on:
  push:
  workflow_dispatch:
jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no moving major tag
        with:
          # No dependencies and no uv.lock in S1: a cache would only warn.
          enable-cache: false
      - name: Run the bootstrap
        run: uv run python hello.py
